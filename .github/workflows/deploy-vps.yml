name: Deploy to VPS

on:
  # Manual trigger only (recommended for safety)
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
  
  # Optional: Auto-deploy on push to main
  # Uncomment if you want automatic deployment
  # push:
  #   branches:
  #     - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive  # Include submodules
      
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts
      
      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key $VPS_USER@$VPS_HOST << ENDSSH
            set -e
            
            echo "📦 Navigating to deployment directory..."
            cd $DEPLOY_PATH
            
            echo "🔄 Pulling latest changes..."
            git pull origin main
            git submodule update --init --recursive
            
            echo "📝 Creating frontend .env file with production settings..."
            echo "# API Configuration - Full URL including /api/v0 path" > frontend/.env
            echo "VITE_API_URL=https://innerpages.ir/api/v0" >> frontend/.env
            echo "" >> frontend/.env
            echo "# Environment" >> frontend/.env
            echo "VITE_ENV=production" >> frontend/.env
            
            echo "🛑 Stopping containers..."
            docker compose -f docker-compose.yml -f docker-compose.prod.yml down || true
            
            echo "🧹 Cleaning up stale networks..."
            docker network disconnect my-inner-pages_app-network journaling-backend 2>/dev/null || true
            docker network disconnect my-inner-pages_app-network journaling-frontend 2>/dev/null || true
            docker network disconnect my-inner-pages_app-network journaling-mongodb 2>/dev/null || true
            docker network rm my-inner-pages_app-network 2>/dev/null || true
            
            echo "🏗️  Building containers..."
            docker compose -f docker-compose.yml -f docker-compose.prod.yml build --no-cache
            
            echo "🚀 Starting containers..."
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
            
            echo "🧹 Cleaning up old images..."
            docker image prune -af --filter "until=24h"
            
            echo "✅ Deployment complete!"
            
            echo "📊 Container status:"
            docker compose -f docker-compose.yml -f docker-compose.prod.yml ps
          ENDSSH
      
      - name: Health check
        run: |
          echo "⏳ Waiting for services to start..."
          sleep 15
          
          echo "🏥 Checking health via domain..."
          curl -f https://innerpages.ir/health || exit 1
          
          echo "✅ Health check passed!"
      
      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
