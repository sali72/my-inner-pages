version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: journaling-backend
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - ./backend/.env
    environment:
      APP_VERSION: "${APP_VERSION:-0.2.0}"
    volumes:
      - ./backend/app:/app/app
    depends_on:
      - mongodb
    restart: unless-stopped
    networks:
      - app-network
    mem_limit: 256m
    cpus: 0.5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:8000/api/v0}
        - VITE_WS_URL=${VITE_WS_URL:-ws://localhost:8000/api/v0}
    container_name: journaling-frontend
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - app-network
    mem_limit: 128m
    cpus: 0.5

  redis:
    image: redis:7.4-alpine
    container_name: journaling-redis
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped
    networks:
      - app-network
    command: redis-server --requirepass ${REDIS_PASSWORD:-} --appendonly no --save ""
    mem_limit: 64m
    cpus: 0.25

  mongodb:
    image: mongo:4.4
    container_name: journaling-mongodb
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped
    networks:
      - app-network
    command: mongod --wiredTigerCacheSizeGB 0.2 --nojournal
    mem_limit: 200m
    cpus: 0.5

volumes:
  mongodb_data:
    labels:
      keep: "true"

networks:
  app-network:
    driver: bridge
