name: Deploy to VPS

on:
  # Manual trigger only (recommended for safety)
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
  
  # Optional: Auto-deploy on push to main
  # Uncomment if you want automatic deployment
  # push:
  #   branches:
  #     - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ github.event.inputs.environment || 'production' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive  # Include submodules
      
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts
      
      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key -o ServerAliveInterval=60 -o ServerAliveCountMax=5 $VPS_USER@$VPS_HOST << ENDSSH
            set -e
            
            echo "📦 Navigating to deployment directory..."
            cd $DEPLOY_PATH
            
            echo "🔄 Pulling latest changes..."
            git pull origin main
            git submodule update --init --recursive
            
            echo "🔧 Checking nginx configuration..."
            if ! cmp -s nginx/nginx.conf /etc/nginx/nginx.conf || ! cmp -s nginx/innerpages.ir.conf /etc/nginx/sites-available/innerpages.ir; then
                echo "📝 Nginx config changed, updating..."
                sudo cp nginx/nginx.conf /etc/nginx/nginx.conf
                sudo cp nginx/innerpages.ir.conf /etc/nginx/sites-available/innerpages.ir
                sudo nginx -t && sudo systemctl reload nginx
            else
                echo "✓ Nginx config unchanged, skipping"
            fi
            
            echo "🛑 Stopping containers..."
            docker compose -f docker-compose.yml -f docker-compose.prod.yml down || true
            
            echo "🧹 Cleaning up stale networks..."
            docker network disconnect my-inner-pages_app-network journaling-backend 2>/dev/null || true
            docker network disconnect my-inner-pages_app-network journaling-frontend 2>/dev/null || true
            docker network disconnect my-inner-pages_app-network journaling-mongodb 2>/dev/null || true
            docker network rm my-inner-pages_app-network 2>/dev/null || true
            
            echo "📝 Creating root .env file for docker-compose..."
            echo "VITE_API_URL=https://innerpages.ir/api/v0" > .env
            echo "VITE_WS_URL=wss://innerpages.ir/api/v0" >> .env
            echo "VITE_ENV=production" >> .env
            
            echo "🏗️  Building containers (15 min timeout)..."
            timeout 900 docker compose -f docker-compose.yml -f docker-compose.prod.yml build
            
            echo "🚀 Starting containers..."
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
            
            echo "🧹 Cleaning up old images..."
            docker image prune -af --filter "until=24h"
            
            echo "✅ Deployment complete!"
            
            echo "📊 Container status:"
            docker compose -f docker-compose.yml -f docker-compose.prod.yml ps
          ENDSSH
      
      - name: Health check
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          echo "⏳ Waiting for services to start..."
          sleep 20
          
          echo "🏥 Checking health directly on server..."
          ssh -i ~/.ssh/deploy_key -o ServerAliveInterval=60 -o ServerAliveCountMax=5 $VPS_USER@$VPS_HOST << ENDSSH
            set -e
            cd $DEPLOY_PATH
            
            # Check via localhost (bypasses Cloudflare)
            curl -f http://localhost/health || exit 1
            
            echo "✅ Health check passed!"
          ENDSSH
      
      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
