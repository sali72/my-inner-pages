version: "3.8"

# Low-memory production configuration
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# This file OVERRIDES settings from docker-compose.yml:
# - Removes volume mounts (no hot-reload)
# - Changes ports (80 for frontend, standard ports for others)
# - Adds memory reservations
# - Optimizes MongoDB settings

services:
  backend:
    ports:
      - "127.0.0.1:8000:8000" # Only accessible from localhost (nginx)
    volumes: [] # Remove volume mount for production (no hot-reload needed)
    mem_limit: 256m
    mem_reservation: 128m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    ports:
      - "127.0.0.1:8080:80" # Only accessible from localhost (nginx), avoid port 80 conflict
    mem_limit: 128m
    mem_reservation: 64m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    ports:
      - "127.0.0.1:6379:6379" # Only accessible from localhost
    mem_limit: 64m
    mem_reservation: 32m
    cpus: 0.25
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mongodb:
    ports:
      - "127.0.0.1:27017:27017" # Only accessible from localhost
    command: mongod --wiredTigerCacheSizeGB 0.2 --nojournal
    mem_limit: 200m
    mem_reservation: 100m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
