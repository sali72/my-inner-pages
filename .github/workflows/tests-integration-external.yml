name: Integration Tests — External

on:
  workflow_dispatch:

jobs:
  external-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Run external integration tests
        working-directory: backend
        env:
          USE_MOCK_LLM: ${{ secrets.USE_MOCK_LLM || 'true' }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY || '' }}
        run: uv run pytest tests/Integration/External/ -v --tb=short
