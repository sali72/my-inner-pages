version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: journaling-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/app:/app/app
    depends_on:
      - mongodb
    restart: unless-stopped
    networks:
      - app-network
    mem_limit: 256m
    cpus: 0.5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:8000/api/v0}
    container_name: journaling-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - app-network
    mem_limit: 128m
    cpus: 0.5

  mongodb:
    image: mongo:4.4
    container_name: journaling-mongodb
    ports:
      - "27018:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped
    networks:
      - app-network
    command: mongod --wiredTigerCacheSizeGB 0.2 --nojournal
    mem_limit: 200m
    cpus: 0.5

volumes:
  mongodb_data:

networks:
  app-network:
    driver: bridge
